---

services:
  localstack:
    image: localstack/localstack
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=1
      - EXTRA_CORS_ALLOWED_ORIGINS="http://localhost:8080,http://localhost,localhost,localhost:8080"
      - DISABLE_CORS_CHECKS="true"
      - DISABLE_CORS_HEADERS="0"
      - DISABLE_CUSTOM_CORS_APIGATEWAY="1"
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
#      - "./localstack-core:/opt/code/localstack/localstack-core/localstack"
