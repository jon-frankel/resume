---

services:
  localstack:
    image: localstack/localstack
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=0
      # localstack has a weird bug where the origin you want allowed needs to be in the middle of a list.
      # It can't be first or last!
      - EXTRA_CORS_ALLOWED_ORIGINS="does-not-matter,http://localhost,http://localhost:8080,also-does-not-matter"
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
