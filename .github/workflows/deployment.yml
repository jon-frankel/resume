---

name: Deployment
run-name: Deployment ${{ github.event.deployment_status.state }} on ${{ github.event.deployment.environment }} by ${{ github.actor }}

on:
  deployment_status:

jobs:
  status_update:
    runs-on: ubuntu-latest
    steps:
      - name: Event payload
        run: |
          echo "${{ toJson(github.event) }}"
      - name: Fail job if deployment failed
        if: ${{ github.event.deployment_status.state == 'failure' }}
        run: |
          echo "Deployment failed"
          exit 1

  smoke-test:
    runs-on: ubuntu-latest
    needs: status_update
    if: ${{ github.event.deployment_status.state == 'success' }}
    steps:
      - name: Set environment for branch
        run: |
          if [[ $GITHUB_REF_NAME == 'main' ]]; then
            echo "URL=https://resume-staging.frankel.dev" >> "$GITHUB_ENV"
          elif [[ $GITHUB_REF_NAME == 'prod' ]]; then
            echo "URL=https://resume.frankel.dev" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install npm dependencies
        run: npm install -g pnpm && pnpm install

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').dependencies['@playwright/test'])")" >> $GITHUB_ENV

      - name: Cache playwright binaries
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - run: pnpx playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: pnpx playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Run Playwright tests
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

