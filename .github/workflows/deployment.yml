---

name: Deployment
run-name: Deployment ${{ github.event.deployment_status.state }} on ${{ github.event.deployment.environment }} by ${{ github.actor }}

on:
  deployment_status:

jobs:
  status-update:
    name: Status update
    runs-on: ubuntu-latest
    steps:
      - name: Deployment status
        run: |
          echo "${{ toJson(github.event.deployment_status) }}"
      - name: Fail job if deployment failed
        if: ${{ github.event.deployment_status.state == 'failure' }}
        run: |
          echo "Deployment failed"
          exit 1

  set-url:
    name: Set URL
    runs-on: ubuntu-latest
    needs: status-update
    steps:
      - name: Set URL for main
        if: ${{ github.event.deployment.environment == 'wikiterra/jon-frankel-resume/staging' }}
        run: echo "URL=https://resume-staging.frankel.dev" >> "$GITHUB_ENV"

      - name: Set URL for prod
        if: ${{ github.event.deployment.environment == 'wikiterra/jon-frankel-resume/production' }}
        run: echo "URL=https://resume.frankel.dev" >> "$GITHUB_ENV"

  purge-cache:
    name: Purge Cloudflare cache
    runs-on: ubuntu-latest
    needs: set-url
    if: ${{ github.event.deployment_status.state == 'success' }}
    env:
      CLOUDFLARE_PURGE_CACHE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_CACHE_TOKEN }}
      CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
    steps:
      - name: Purge Cloudflare cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_PURGE_CACHE_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"hosts": ["$URL"]}'

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: purge-cache
    if: ${{ github.event.deployment_status.state == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install npm dependencies
        run: npm install -g pnpm && pnpm install

      - run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
