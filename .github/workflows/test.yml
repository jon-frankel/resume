---

name: Tests

on:
  pull_request:
    branches: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.51.0-noble
      options: --user root -v /var/run/docker.sock:/var/run/docker.sock
    continue-on-error: false
    steps:
      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io
          ln -s /usr/libexec/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pulumi
        uses: pulumi/actions@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker images
        uses: actions/cache@v4
        id: cache-docker
        with:
          path: ~/docker-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('docker-compose.yml') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Load Docker images
        run: |
          if [ -f ~/docker-cache/localstack.tar ]; then
            docker load -i ~/docker-cache/localstack.tar
          else
            docker pull localstack/localstack
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install the Python project
        run: uv sync --locked --all-extras --dev

      - name: Setup pnpm and install dependencies
        uses: pnpm/action-setup@9b5745cdf0a2e8c2620f0746130f809adb911c19
        with:
          version: 10.6.1
          run_install: true
          cache: true

      - name: Start containers
        run: make docker-up

      - name: Save Docker images
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/docker-cache
          docker save localstack/localstack -o ~/docker-cache/localstack.tar

      - name: Pulumi up
        run: make pulumi-up

      - name: Run integration tests
        run: make pytest

      - name: Run Playwright tests
        run: make playwright

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

